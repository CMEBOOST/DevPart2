<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>PART2 WebDev2569</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        
    </head>
    <body>
        <nav class="navbar navbar-expand navbar-light bg-light boder-bottom mb-4">
            <div class="container">
                <span class="navbar-brand">My WebDev Project69</span>
                <div class="">
                    {% if user.is_authenticated %}
                    <span class="me-3">ยินดีต้อนรับ {{ user.username }}</span>
                    <form action="{% url 'logout' %}" method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Logout</button>
                    </form>
                    {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-primary me-2">Login</a>
                    <a href="{% url 'register' %}" class="btn btn-outline-success me-2">Register</a>
                    {% endif %}
                </div>
            </div>
        </nav>
        <main class="container">
            <!-- ส่วนแสดงผลลัพธ์ของแต่ละหน้าเว็บ -->
            {% block contents %}
            {% endblock %}
            
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
    </html>
