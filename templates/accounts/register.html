{% extends 'base.html' %}

{% block contents %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body">
                <h1 class="h4 my-3">สมัครสมาชิก</h1>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">สมัครสมาชิก</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
