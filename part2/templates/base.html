<!DOCTYPE html>
{% load static tailwind_tags %}
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>PART2 WebDev2569</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&display=swap" rel="stylesheet">
        {% tailwind_css %}
    </head>
    <body class="bg-gray-50 min-h-screen flex flex-col font-sans">
        <nav class="bg-white border-b border-gray-200 mb-8">
            <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
                <span class="font-semibold text-lg">My WebDev Project69</span>
                <div class="flex items-center gap-3">
                    {% if user.is_authenticated %}
                    <span class="me-3">ยินดีต้อนรับ {{ user.username }}</span>
                    <a href="{% url 'tailwind_showcase' %}" class="text-sm text-gray-600 bg-violet-300 rounded-md py-1.5 px-3 hover:text-violet-700 transition">Componenet Learning</a>
                    <form action="{% url 'logout' %}" method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="text-sm px-3 py-1.5 rounded-md hover:bg-red-50 bg-red-400">Logout</button>
                    </form>
                    {% else %}
                    <a href="{% url 'login' %}" class="btn-surachet">Login</a>
                    <a href="{% url 'register' %}" class="btn-sud">Register</a>
                    {% endif %}
                </div>
            </div>
        </nav>
        <main class="max-w-4xl mx-auto px-4 flex-1 w-full">
            <!-- ส่วนแสดงผลลัพธ์ของแต่ละหน้าเว็บ -->
            {% block contents %}
            {% endblock %}
            
        </main>
    
    </body>
    </html>
