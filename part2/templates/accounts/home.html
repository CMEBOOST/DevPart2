{% extends 'base.html' %}

{% block contents %}
<h1 class="text-2xl font-semibold mb-2">หน้าแรก</h1>

{% if user.is_authenticated %}
    <p class="text-lg text-gray-700 mb-4">ยินดีต้อนรับกลับมา {{ user.username }}</p>

    {% if profile and profile.avatar %}
        <img src="{{ profile.avatar.url }}" alt="avatar ของ {{ user.username }}"
             class="w-16 h-16 rounded-full object-cover border border-gray-200 mb-4">
    {% else %}
        <div class="mb-4 text-sm text-gray-500">ยังไม่มีรูปโปรไฟล์</div>
    {% endif %}

    <a href="{% url 'profile_edit' %}" class="btn btn-outline-primary">แก้ไขโปรไฟล์ของฉัน</a>
{% else %}
    <h1 class="text-sm text-gray-700 mb-4">ยินดีต้อนรับ</h1>
{% endif %}
{% endblock %}
