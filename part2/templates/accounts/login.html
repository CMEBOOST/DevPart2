{% extends 'base.html' %}

{% block contents %}
<div class="flex justify-center">
    <div class="w-full max-w-sm">
        <div class="bg-white rounded-lg border border-gray-200 p-8 shadow-sm">
            <div class="card-body">
                <h1 class="text-xl text-center font-semibold mb-2">เข้าสู่ระบบ</h1>
                <form method="post">
                    {% csrf_token %}
                    <div class="flex flex-col space-y-2">
                        <label for="username" class="block">Username</label>
                        <input type="text" name="username" class="border border-gray-300 rounded-md focus:ring-blue-500 px-3 py-1">

                        <label for="password" class="block">Password</label>
                        <input type="password" name="password" class="border border-gray-300 rounded-md focus:ring-blue-500 px-3 py-1">

                        <button type="submit" class="btn-sud">เข้าสู่ระบบ</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
