<li id="item-{{ item.id }}" class="flex items-center justify-between px-4 py-2 border-b border-gray-100 last:border-0">
  <form hx-post="{% url 'demo_item_update' item.id %}" hx-target="#item-{{ item.id }}" hx-swap="outerHTML" class="flex w-full items-center gap-2">
    {% csrf_token %}
    <input type="text" name="title" value="{{ item.title }}" class="w-full rounded-md border px-3 py-2" required>
    <button type="submit" class="text-green-600 text-sm hover:underline">บันทึก</button>
    <button type="button" hx-get="{% url 'demo_item_edit_form' item.id %}" hx-target="#item-{{ item.id }}" hx-swap="outerHTML" class="text-gray-600 text-sm hover:underline">ยกเลิก</button>
  </form>
</li>
